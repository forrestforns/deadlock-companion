<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deadlock Companion</title>
  <!-- fonts bundled locally (SIL OFL, see fonts/OFL-*.txt): no request to Google -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 1l11 11-11 11L1 12z"/><path d="M12 5.5l6.5 6.5-6.5 6.5L5.5 12z"/><path d="M12 9v6M9 12h6"/></svg></span>
      <span class="brand-name" data-tauri-drag-region>DEADLOCK <em>COMPANION</em></span>
    </div>
    <div class="win-btns">
      <button data-win="minimize" title="Réduire"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button data-win="toggleMaximize" title="Agrandir"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
      <button data-win="close" class="close" title="Fermer"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar">
      <button class="nav" data-view="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <span>Profil</span>
      </button>
      <button class="nav" data-view="live">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>
        <span>En direct</span>
      </button>
      <button class="nav" data-view="stats">
        <svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 8l4 2.5v4L12 17l-4-2.5v-4z"/></svg>
        <span>Analyse</span>
      </button>
      <button class="nav" data-view="heroes">
        <svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z"/></svg>
        <span>Héros</span>
      </button>
      <button class="nav nav-settings" data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Réglages</span>
      </button>
      <div class="sidebar-foot">
        <span class="dot-live"></span> Données publiques<br><small>deadlock-api.com</small><br><small>Non officiel · non affilié à Valve</small>
      </div>
    </nav>
    <main id="view"></main>
  </div>

  <div id="toast"></div>
  <div id="update-bar" hidden></div>
  <script src="app.js"></script>
</body>
</html>
