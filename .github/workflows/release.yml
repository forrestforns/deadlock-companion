# Publishes a signed release when the app version (tauri.conf.json) changes on main:
# bump the version, commit, push. Already-published versions are skipped. Can also be run by hand.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           content of ~/.tauri/deadlock-companion.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  content of ~/.tauri/deadlock-companion.key.password.txt
# Errors are re-emitted as annotations, which are readable without signing in to GitHub.
name: release

on:
  push:
    branches: [main]
    paths: ["tauri.conf.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # version from tauri.conf.json; the release job only runs if that version is not published yet
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r .version tauri.conf.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag est déjà publiée, rien à faire"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: windows-latest
    # The update-signing key is given ONLY to the two steps that sign (Check signing key, Build), never to
    # the whole job: a compromised third-party action could otherwise steal it and sign fake updates.
    # Third-party actions are pinned to a commit (tags can be moved), the Tauri CLI to an exact version.
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # needed to build the vendored haste (Valve protobufs)
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # setup-protoc only adds protoc to PATH; without PROTOC set, .cargo/config.toml would point to
      # tools/protoc, which is not in the repository
      - name: Set PROTOC
        shell: pwsh
        run: echo "PROTOC=$((Get-Command protoc).Source)" >> $env:GITHUB_ENV

      # fail early, with a clear message, if the signing secrets are missing or wrong
      - name: Check signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY manquant"; exit 1 }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD manquant"; exit 1 }
          "test" | Out-File sign-test.txt
          $out = npx --yes @tauri-apps/cli@2.12.4 signer sign sign-test.txt 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            $out -split "`n" | ? { $_.Trim() } | Select-Object -Last 5 | % { echo "::error::Signature impossible: $($_ -replace '%','%25')" }
            exit 1
          }
          "Cle de signature OK"

      # compile WITHOUT the key: the build scripts of every dependency run here
      - name: Build
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2.12.4 build --no-bundle 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | ? { $_.Trim() } | Select-Object -Last 25 | % { echo "::error::$($_ -replace '%','%25')" }
            exit 1
          }

      # installer + its update signature: the only step that gets the key
      - name: Bundle and sign
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2.12.4 bundle 2>&1 | Tee-Object -FilePath bundle.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content bundle.log | ? { $_.Trim() } | Select-Object -Last 25 | % { echo "::error::$($_ -replace '%','%25')" }
            exit 1
          }

      # installer + updater manifest (latest.json) consumed by the app's updater
      - name: Prepare release files
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          $exe = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          $name = "DeadlockCompanion_${v}_x64-setup.exe"
          New-Item -ItemType Directory out | Out-Null
          Copy-Item $exe.FullName "out/$name"
          # same installer under a fixed name: .../releases/latest/download/DeadlockCompanion-setup.exe always works
          Copy-Item $exe.FullName "out/DeadlockCompanion-setup.exe"
          $sig = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$name"
          @{
            version  = $v
            notes    = "Deadlock Companion $v"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig; url = $url } }
          } | ConvertTo-Json -Depth 4 | Set-Content out/latest.json -Encoding utf8NoBOM
          Get-ChildItem out

      # creates the tag on this commit and the release with its files
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Deadlock Companion ${{ env.TAG }}
          body: |
            ## Installer l'app
            1. Dans **Assets** ci-dessous, télécharge **`DeadlockCompanion-setup.exe`**.
               *Ne prends pas « Source code (zip) » ni « Source code (tar.gz) » : c'est le code source, pas l'application.*
            2. Lance le fichier téléchargé. Si Windows affiche « Windows a protégé votre ordinateur », clique sur
               **Informations complémentaires** puis **Exécuter quand même** (l'app n'est pas encore signée).
            3. L'app s'installe et s'ouvre ; tu la retrouves ensuite dans le menu Démarrer.

            Déjà installée ? Rien à faire : elle se met à jour toute seule au lancement.

            Application de fan non officielle, non affiliée à Valve.
          files: out/*
